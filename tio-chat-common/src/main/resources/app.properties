# 公共配置：所有服务共用。app.name、server.port 由各服务的启动类给出默认值，也可以用
# --server.port=xxx 或环境变量覆盖
app.env=dev
http.response.charset=utf-8
http.multipart.max-file-size=104857600
server.http.response.cors.enable=true
tio.no.server=false
server.heartbeat.timeout=30000
server.shutdown.hook=true

# Nacos：单独运行的服务默认注册，所有模块一个服务时默认不注册（nacos.discovery.enabled）
nacos.server-addr=127.0.0.1:8848
nacos.namespace=hula-dev
nacos.username=nacos
nacos.password=nacos
nacos.discovery.ip=127.0.0.1

# 服务间调用的内部密钥，生产环境请修改
chat.internal.secret=tio-chat-internal

# 密码连续输错达到上限后锁定账号，0 表示不限制
chat.password.max-error-num=10
chat.password.lock-minutes=15
