app.name=tio-chat-server
app.env=dev
server.port=18760
http.response.charset=utf-8
http.multipart.max-file-size=104857600
server.http.response.cors.enable=true
tio.no.server=false
server.heartbeat.timeout=30000
server.shutdown.hook=true

# Nacos: off by default; behind tio-chat-gateway start with
#   --server.port=18761 --nacos.discovery.enabled=true
nacos.discovery.enabled=false
nacos.server-addr=127.0.0.1:8848
nacos.namespace=hula-dev
nacos.username=nacos
nacos.password=nacos
nacos.discovery.ip=127.0.0.1
# one process serves every module until they are split into services
nacos.discovery.service=luohuo-oauth-server
nacos.discovery.extra-services=luohuo-im-server,luohuo-base-server,luohuo-system-server,luohuo-ai-server,luohuo-ws-server
