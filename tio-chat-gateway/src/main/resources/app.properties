app.name=luohuo-gateway-server
app.env=dev
server.port=18760
server.shutdown.hook=true
server.heartbeat.timeout=60000
http.multipart.max-file-size=104857600

nacos.server-addr=127.0.0.1:8848
nacos.namespace=hula-dev
nacos.username=nacos
nacos.password=nacos
nacos.discovery.ip=127.0.0.1
# 路由也可以放在 Nacos 的 luohuo-gateway-server.yml 中，修改后立即生效
#nacos.config.data-ids=luohuo-gateway-server.yml

# 读取登录会话，向下游传递 userId、uid、tenantId、systemType
redis.host=127.0.0.1
redis.port=6379
redis.database=0

# 服务连续失败时熔断，返回和 /api/fallback 相同的响应
gateway.circuit-breaker.enabled=true
gateway.circuit-breaker.failure-threshold=5
gateway.circuit-breaker.open-seconds=10

# 路由与原网关一致，各服务保留 /api 前缀，不需要 StripPrefix
gateway.routes[0].id=oauth
gateway.routes[0].uri=lb://luohuo-oauth-server
gateway.routes[0].predicates[0]=Path=/api/oauth/**
gateway.routes[1].id=im
gateway.routes[1].uri=lb://luohuo-im-server
gateway.routes[1].predicates[0]=Path=/api/im/**
gateway.routes[2].id=base
gateway.routes[2].uri=lb://luohuo-base-server
gateway.routes[2].predicates[0]=Path=/api/base/**
gateway.routes[3].id=system
gateway.routes[3].uri=lb://luohuo-system-server
gateway.routes[3].predicates[0]=Path=/api/system/**
gateway.routes[4].id=ai
gateway.routes[4].uri=lb://luohuo-ai-server
gateway.routes[4].predicates[0]=Path=/api/ai/**
gateway.routes[5].id=ws
gateway.routes[5].uri=lb:ws://luohuo-ws-server
gateway.routes[5].predicates[0]=Path=/api/ws/**,/ws/**

gateway.routes[6].id=generator
gateway.routes[6].uri=lb://luohuo-generator-server
gateway.routes[6].predicates[0]=Path=/api/generator/**

# 灰度：请求头 gray_version 与实例元数据 gray_version 相同的实例优先
cloud.loadbalancer.metadata-header=gray_version
